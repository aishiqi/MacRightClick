name: MacRightClick
options:
  bundleIdPrefix: com.macrightclick
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 36LWH3ZXTR
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  MacRightClick:
    type: application
    platform: macOS
    sources:
      - path: MacRightClick
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrightclick.app
        PRODUCT_NAME: MacRightClick
        INFOPLIST_FILE: MacRightClick/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacRightClick/MacRightClick.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: MacRightClick/MacRightClick.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    dependencies:
      - target: MacRightClickFinderExtension
        embed: true
        codeSign: true
      - sdk: FinderSync.framework

  MacRightClickFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MacRightClickFinderExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrightclick.app.FinderExtension
        PRODUCT_NAME: MacRightClickFinderExtension
        INFOPLIST_FILE: MacRightClickFinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacRightClickFinderExtension/MacRightClickFinderExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: MacRightClickFinderExtension/MacRightClickFinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /
        com.apple.security.temporary-exception.apple-events:
          - com.apple.finder
    dependencies:
      - sdk: FinderSync.framework

schemes:
  MacRightClick:
    build:
      targets:
        MacRightClick: all
        MacRightClickFinderExtension: all
    run:
      config: Debug
      askForAppToLaunch: false
    archive:
      config: Release
